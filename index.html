<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YouTube字幕要約</title>
<link rel="icon" href="icon-512.png" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --muted: #666666;
    --border: #d9dce1;
    --accent: #cc0000;
    --accent-hover: #a30000;
    --error: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
      "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 60px;
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.4rem;
    margin-bottom: 4px;
  }
  p.lead {
    color: var(--muted);
    margin-top: 0;
    margin-bottom: 24px;
    font-size: 0.9rem;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  label {
    display: block;
    font-weight: 600;
    margin-bottom: 8px;
    font-size: 0.9rem;
  }
  .input-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  input[type="url"] {
    flex: 1 1 240px;
    min-width: 0;
    padding: 12px 14px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: inherit;
  }
  input[type="url"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  button {
    padding: 12px 20px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover:not(:disabled) {
    background: var(--accent-hover);
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .status {
    margin-top: 14px;
    font-size: 0.9rem;
    color: var(--muted);
    display: none;
    align-items: center;
    gap: 8px;
  }
  .status.visible {
    display: flex;
  }
  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .error {
    margin-top: 14px;
    color: var(--error);
    font-weight: 600;
    font-size: 0.9rem;
    white-space: pre-wrap;
    display: none;
  }
  .error.visible {
    display: block;
  }
  .result-card {
    display: none;
  }
  .result-card.visible {
    display: block;
  }
  .result-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    gap: 8px;
    flex-wrap: wrap;
  }
  .result-header h2 {
    font-size: 1.05rem;
    margin: 0;
  }
  .copy-btn {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 8px 14px;
    font-size: 0.85rem;
  }
  .copy-btn:hover:not(:disabled) {
    background: var(--accent);
    color: #fff;
  }
  textarea#result {
    width: 100%;
    min-height: 320px;
    resize: vertical;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    font-size: 0.95rem;
    line-height: 1.6;
    font-family: inherit;
    background: transparent;
    color: inherit;
  }
  .meta {
    margin-top: 8px;
    font-size: 0.8rem;
    color: var(--muted);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --card-bg: #1f2227;
      --text: #eaeaea;
      --muted: #9a9a9a;
      --border: #34383f;
      --accent: #ff4b4b;
      --accent-hover: #ff6c6c;
      --error: #ff6b6b;
    }
  }
</style>
</head>
<body>
<div class="container">
  <h1>YouTube字幕要約</h1>
  <p class="lead">YouTube動画のURLを入力すると、字幕を取得してClaudeが日本語で要約します。</p>

  <div class="card">
    <label for="url-input">YouTube動画のURL</label>
    <div class="input-row">
      <input
        id="url-input"
        type="url"
        inputmode="url"
        placeholder="https://www.youtube.com/watch?v=..."
        autocomplete="off"
      />
      <button id="submit-btn" type="button">要約する</button>
    </div>
    <div class="status" id="status">
      <span class="spinner" aria-hidden="true"></span>
      <span id="status-text">字幕を取得して要約しています…</span>
    </div>
    <div class="error" id="error"></div>
  </div>

  <div class="card result-card" id="result-card">
    <div class="result-header">
      <h2>要約結果</h2>
      <button class="copy-btn" id="copy-btn" type="button">コピー</button>
    </div>
    <textarea id="result" readonly></textarea>
    <div class="meta" id="meta"></div>
  </div>
</div>

<script>
  // Cloudflare Worker のURLをここに設定してください。
  const WORKER_URL = "https://youtube-caption-summarizer.tackro-i.workers.dev";

  const urlInput = document.getElementById("url-input");
  const submitBtn = document.getElementById("submit-btn");
  const statusEl = document.getElementById("status");
  const statusText = document.getElementById("status-text");
  const errorEl = document.getElementById("error");
  const resultCard = document.getElementById("result-card");
  const resultEl = document.getElementById("result");
  const metaEl = document.getElementById("meta");
  const copyBtn = document.getElementById("copy-btn");

  function setLoading(isLoading) {
    submitBtn.disabled = isLoading;
    urlInput.disabled = isLoading;
    statusEl.classList.toggle("visible", isLoading);
  }

  function showError(message) {
    errorEl.textContent = message;
    errorEl.classList.add("visible");
  }

  function clearError() {
    errorEl.textContent = "";
    errorEl.classList.remove("visible");
  }

  function showResult(summary, transcriptLang, availableLangs) {
    resultEl.value = summary;
    resultCard.classList.add("visible");
    const parts = [];
    if (transcriptLang) parts.push(`字幕言語: ${transcriptLang}`);
    if (Array.isArray(availableLangs) && availableLangs.length > 0) {
      parts.push(`利用可能な言語: ${availableLangs.join(", ")}`);
    }
    metaEl.textContent = parts.join(" / ");
  }

  async function handleSubmit() {
    const url = urlInput.value.trim();
    clearError();
    resultCard.classList.remove("visible");

    if (!url) {
      showError("YouTube動画のURLを入力してください。");
      return;
    }

    if (!WORKER_URL || WORKER_URL.includes("your-worker-subdomain")) {
      showError("Worker URLが設定されていません。index.html内のWORKER_URLを設定してください。");
      return;
    }

    setLoading(true);
    statusText.textContent = "字幕を取得して要約しています…";

    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url }),
      });

      let data;
      try {
        data = await res.json();
      } catch {
        throw new Error("サーバーからの応答を解析できませんでした。");
      }

      if (!res.ok || !data.ok) {
        throw new Error(data.error || "要約に失敗しました。");
      }

      showResult(data.summary, data.transcriptLang, data.availableLangs);
    } catch (err) {
      showError(err.message || "通信エラーが発生しました。しばらくしてから再試行してください。");
    } finally {
      setLoading(false);
    }
  }

  submitBtn.addEventListener("click", handleSubmit);
  urlInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") handleSubmit();
  });

  copyBtn.addEventListener("click", async () => {
    if (!resultEl.value) return;
    try {
      await navigator.clipboard.writeText(resultEl.value);
      const original = copyBtn.textContent;
      copyBtn.textContent = "コピーしました";
      setTimeout(() => (copyBtn.textContent = original), 1500);
    } catch {
      resultEl.select();
      document.execCommand("copy");
    }
  });
</script>
</body>
</html>
