<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>動画字幕要約</title>
<link rel="icon" href="icon-512.png" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<style>
  :root {
    color-scheme: light dark;

    --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
      "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI",
      "Yu Gothic", Meiryo, sans-serif;

    --text-xs: 0.75rem;
    --text-sm: 0.875rem;
    --text-md: 1rem;
    --text-lg: 1.125rem;
    --text-xl: 1.375rem;
    --text-2xl: 1.75rem;

    --weight-medium: 500;
    --weight-semibold: 600;
    --weight-bold: 700;

    --leading-ui: 1.45;
    --leading-body: 1.7;
    --tracking-ja: 0.01em;

    --space-1: 0.25rem;
    --space-2: 0.5rem;
    --space-3: 0.75rem;
    --space-4: 1rem;
    --space-5: 1.25rem;
    --space-6: 1.5rem;
    --space-8: 2rem;

    --radius-sm: 0.375rem;
    --radius-md: 0.625rem;
    --radius-lg: 1rem;
    --radius-pill: 999px;

    --content-reading: 42rem;
    --page-gutter: clamp(1rem, 3vw, 2rem);

    --control-touch: 2.75rem;

    --duration-fast: 160ms;
    --duration-normal: 240ms;
    --ease-standard: cubic-bezier(0.2, 0, 0, 1);

    --color-bg: #F5F5F7;
    --color-surface: #FFFFFF;
    --color-surface-subtle: #F0F1F3;

    --color-text: #1D1D1F;
    --color-text-secondary: #5C5C63;
    --color-text-tertiary: #74747C;
    --color-text-on-accent: #FFFFFF;

    --color-border: #D9DADE;
    --color-separator: rgba(29, 29, 31, 0.12);

    --color-accent: #006EDB;
    --color-accent-hover: #005FBE;
    --color-accent-pressed: #004F9E;
    --color-focus: #087FE7;

    --color-danger: #C62828;
    --color-danger-surface: #FDECEC;

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.08);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --color-bg: #101114;
      --color-surface: #1B1C20;
      --color-surface-subtle: #222328;

      --color-text: #F5F5F7;
      --color-text-secondary: #C5C6CC;
      --color-text-tertiary: #A5A7AF;
      --color-text-on-accent: #08111A;

      --color-border: #3A3C43;
      --color-separator: rgba(255, 255, 255, 0.14);

      --color-accent: #4CA6FF;
      --color-accent-hover: #73B9FF;
      --color-accent-pressed: #2C8DEB;
      --color-focus: #72B7FF;

      --color-danger: #FF7773;
      --color-danger-surface: #4A2022;

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.32);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--font-sans);
    background: var(--color-bg);
    color: var(--color-text);
    letter-spacing: var(--tracking-ja);
    padding: var(--space-8) var(--page-gutter) var(--space-8);
  }

  .container {
    max-width: var(--content-reading);
    margin: 0 auto;
  }

  h1 {
    font-size: clamp(var(--text-xl), 4vw, var(--text-2xl));
    line-height: var(--leading-ui);
    font-weight: var(--weight-bold);
    margin: 0 0 var(--space-1);
  }

  h1 button {
    all: unset;
    cursor: pointer;
    font: inherit;
    font-weight: inherit;
    color: inherit;
    border-radius: var(--radius-sm);
  }

  h1 button:hover {
    color: var(--color-accent);
  }

  h1 button:focus-visible {
    outline: 2px solid var(--color-focus);
    outline-offset: 2px;
  }

  p.lead {
    color: var(--color-text-secondary);
    line-height: var(--leading-body);
    margin: 0 0 var(--space-6);
    font-size: var(--text-sm);
    max-width: 38em;
  }

  .card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: var(--space-5);
    margin-bottom: var(--space-5);
  }

  label {
    display: block;
    font-weight: var(--weight-semibold);
    margin-bottom: var(--space-2);
    font-size: var(--text-sm);
  }

  .input-row {
    display: flex;
    gap: var(--space-2);
    flex-wrap: wrap;
  }

  input[type="url"] {
    flex: 1 1 240px;
    min-width: 0;
    height: var(--control-touch);
    padding: 0 var(--space-4);
    font-size: var(--text-md);
    font-family: inherit;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    background: transparent;
    color: inherit;
  }

  input[type="url"]:focus-visible {
    outline: 2px solid var(--color-focus);
    outline-offset: 1px;
    border-color: var(--color-focus);
  }

  button {
    height: var(--control-touch);
    padding: 0 var(--space-5);
    font-size: var(--text-md);
    font-family: inherit;
    font-weight: var(--weight-semibold);
    border: none;
    border-radius: var(--radius-md);
    background: var(--color-accent);
    color: var(--color-text-on-accent);
    cursor: pointer;
    white-space: nowrap;
    transition: background var(--duration-fast) var(--ease-standard);
  }

  button:hover:not(:disabled) {
    background: var(--color-accent-hover);
  }

  button:active:not(:disabled) {
    background: var(--color-accent-pressed);
  }

  button:focus-visible {
    outline: 2px solid var(--color-focus);
    outline-offset: 2px;
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .mode-row {
    margin: var(--space-4) 0;
  }

  .segmented {
    display: inline-flex;
    gap: 2px;
    padding: 3px;
    background: var(--color-surface-subtle);
    border-radius: var(--radius-pill);
    max-width: 100%;
  }

  .segmented-option {
    position: relative;
    margin: 0;
    font-weight: var(--weight-medium);
  }

  .segmented-option input {
    position: absolute;
    inset: 0;
    opacity: 0;
    margin: 0;
    cursor: pointer;
  }

  .segmented-option span {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 2.25rem;
    padding: 0 var(--space-4);
    border-radius: var(--radius-pill);
    font-size: var(--text-sm);
    color: var(--color-text-secondary);
    white-space: nowrap;
    transition: background var(--duration-fast) var(--ease-standard),
      color var(--duration-fast) var(--ease-standard);
  }

  .segmented-option input:checked + span {
    background: var(--color-surface);
    color: var(--color-text);
    font-weight: var(--weight-semibold);
    box-shadow: var(--shadow-sm);
  }

  .segmented-option input:focus-visible + span {
    outline: 2px solid var(--color-focus);
    outline-offset: 2px;
  }

  .hint {
    color: var(--color-text-tertiary);
    font-size: var(--text-xs);
    line-height: var(--leading-ui);
    margin: 0;
  }

  .status {
    margin-top: var(--space-4);
    font-size: var(--text-sm);
    color: var(--color-text-secondary);
    display: none;
    align-items: center;
    gap: var(--space-2);
  }

  .status.visible {
    display: flex;
  }

  .spinner {
    width: 16px;
    height: 16px;
    flex: none;
    border: 2px solid var(--color-border);
    border-top-color: var(--color-accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .error {
    margin-top: var(--space-4);
    padding: var(--space-3) var(--space-4);
    background: var(--color-danger-surface);
    color: var(--color-danger);
    border-radius: var(--radius-md);
    font-size: var(--text-sm);
    line-height: var(--leading-ui);
    white-space: pre-wrap;
    display: none;
  }

  .error.visible {
    display: flex;
    gap: var(--space-2);
  }

  .error .error-icon {
    flex: none;
  }

  .result-card {
    display: none;
  }

  .result-card.visible {
    display: block;
  }

  .result-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: var(--space-3);
    gap: var(--space-2);
    flex-wrap: wrap;
  }

  .result-heading {
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
  }

  .result-header h2 {
    font-size: var(--text-lg);
    font-weight: var(--weight-semibold);
    margin: 0;
  }

  .read-time {
    font-size: var(--text-xs);
    font-weight: var(--weight-medium);
    color: var(--color-text-tertiary);
  }

  .topics {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-1);
    margin-top: var(--space-1);
  }

  .topics[hidden] {
    display: none;
  }

  .topic-tag {
    padding: 2px var(--space-3);
    border-radius: var(--radius-pill);
    background: var(--color-surface-subtle);
    color: var(--color-text-secondary);
    font-size: var(--text-xs);
    font-weight: var(--weight-medium);
  }

  .result-actions {
    display: flex;
    gap: var(--space-2);
    flex-wrap: wrap;
  }

  .secondary-btn {
    height: 2rem;
    padding: 0 var(--space-3);
    background: transparent;
    color: var(--color-text-secondary);
    border: 1px solid var(--color-border);
    font-size: var(--text-xs);
    font-weight: var(--weight-medium);
  }

  .secondary-btn:hover:not(:disabled) {
    border-color: var(--color-accent);
    color: var(--color-accent);
    background: transparent;
  }

  .secondary-btn:active:not(:disabled) {
    background: transparent;
  }

  .secondary-btn[hidden] {
    display: none;
  }

  #result {
    display: block;
    width: 100%;
    min-height: 320px;
    max-height: 75vh;
    overflow-y: auto;
    resize: vertical;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: var(--space-4);
    font-size: var(--text-md);
    line-height: var(--leading-body);
    letter-spacing: var(--tracking-ja);
    font-family: inherit;
    background: transparent;
    color: inherit;
    transition: min-height var(--duration-normal) var(--ease-standard);
  }

  #result:focus-visible {
    outline: 2px solid var(--color-focus);
    outline-offset: 1px;
  }

  #result > :first-child {
    margin-top: 0;
  }

  #result > :last-child {
    margin-bottom: 0;
  }

  #result h3 {
    font-size: var(--text-md);
    font-weight: var(--weight-semibold);
    margin: var(--space-5) 0 var(--space-2);
  }

  #result h4 {
    font-size: var(--text-sm);
    font-weight: var(--weight-semibold);
    color: var(--color-text-secondary);
    margin: var(--space-4) 0 var(--space-1);
  }

  #result p {
    margin: 0 0 var(--space-3);
  }

  #result ul,
  #result ol {
    margin: 0 0 var(--space-3);
    padding-left: 1.4em;
  }

  #result li {
    margin-bottom: var(--space-1);
  }

  #result li::marker {
    color: var(--color-text-tertiary);
  }

  #result strong {
    font-weight: var(--weight-semibold);
  }

  .result-card.expanded #result {
    min-height: 75vh;
  }

  .meta {
    margin-top: var(--space-2);
    font-size: var(--text-xs);
    color: var(--color-text-tertiary);
  }

  @media (max-width: 599px) {
    .input-row {
      flex-direction: column;
    }
    .input-row > * {
      width: 100%;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 1ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 1ms !important;
    }
  }
</style>
</head>
<body>
<div class="container">
  <h1><button id="title-btn" type="button" title="最初からやり直す" aria-label="動画字幕要約（クリックで最初からやり直す）">動画字幕要約</button></h1>
  <p class="lead">動画のURL（YouTube / TikTok / Instagram / X / Facebook）を入力すると、字幕を取得してClaudeが日本語で要約します。</p>

  <div class="card">
    <label for="url-input">動画のURL</label>
    <div class="input-row">
      <input
        id="url-input"
        type="url"
        inputmode="url"
        placeholder="https://www.youtube.com/watch?v=... など"
        autocomplete="off"
      />
      <button id="submit-btn" type="button">要約する</button>
    </div>

    <div class="mode-row">
      <div class="segmented" role="radiogroup" aria-label="出力モード">
        <label class="segmented-option">
          <input type="radio" name="mode" value="summary" checked />
          <span>要約</span>
        </label>
        <label class="segmented-option">
          <input type="radio" name="mode" value="transcript" />
          <span>全文文字起こし</span>
        </label>
      </div>
    </div>

    <p class="hint">長い動画は要約に時間がかかる場合があります（数分程度）。</p>

    <div class="status" id="status" role="status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <span id="status-text">字幕を取得して要約しています…</span>
    </div>
    <div class="error" id="error" role="alert">
      <span class="error-icon" aria-hidden="true">⚠</span>
      <span id="error-text"></span>
    </div>
  </div>

  <div class="card result-card" id="result-card">
    <div class="result-header">
      <div class="result-heading">
        <h2 id="result-title">要約結果</h2>
        <span class="read-time" id="read-time"></span>
        <div class="topics" id="topics" hidden></div>
      </div>
      <div class="result-actions">
        <button class="secondary-btn" id="expand-btn" type="button">大きく表示</button>
        <button class="secondary-btn" id="copy-btn" type="button">コピー</button>
        <button class="secondary-btn" id="save-btn" type="button">Markdown保存</button>
      </div>
    </div>
    <div id="result" tabindex="0"></div>
    <div class="meta" id="meta"></div>
  </div>
</div>

<script>
  // Cloudflare Worker のURLをここに設定してください。
  const WORKER_URL = "https://youtube-caption-summarizer.tackro-i.workers.dev";

  const titleBtn = document.getElementById("title-btn");
  const urlInput = document.getElementById("url-input");
  const submitBtn = document.getElementById("submit-btn");
  const modeRadios = document.querySelectorAll('input[name="mode"]');
  const statusEl = document.getElementById("status");
  const statusText = document.getElementById("status-text");
  const errorEl = document.getElementById("error");
  const errorText = document.getElementById("error-text");
  const resultCard = document.getElementById("result-card");
  const resultTitle = document.getElementById("result-title");
  const resultEl = document.getElementById("result");
  const metaEl = document.getElementById("meta");
  const copyBtn = document.getElementById("copy-btn");
  const saveBtn = document.getElementById("save-btn");
  const expandBtn = document.getElementById("expand-btn");
  const readTimeEl = document.getElementById("read-time");
  const topicsEl = document.getElementById("topics");

  let currentRawText = "";

  // The summarizer returns an Obsidian Source Note: a YAML frontmatter block
  // (title/topics/...) followed by a redundant H1 and the Markdown body.
  // Pull the metadata out so it drives the header instead of being read as prose.
  function parseSourceNote(raw) {
    const fmMatch = raw.match(/^---\s*\n([\s\S]*?)\n---\s*\n?/);
    if (!fmMatch) return { title: "", topics: [], body: raw };

    const fm = fmMatch[1];
    const titleMatch = fm.match(/^title:\s*"?(.*?)"?\s*$/m);
    const topicsBlock = fm.match(/^topics:\s*\n((?:\s*-\s*.+\n?)*)/m);
    const topics = topicsBlock
      ? topicsBlock[1]
          .split("\n")
          .map((l) => l.trim().replace(/^-+\s*/, ""))
          .filter(Boolean)
      : [];

    let body = raw.slice(fmMatch[0].length);
    body = body.replace(/^\s*#\s+.+\n/, ""); // drop the H1 that just repeats the title

    return { title: titleMatch ? titleMatch[1].trim() : "", topics, body: body.trim() };
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function renderInline(text) {
    return escapeHtml(text).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  }

  // Claude's summary comes back as light Markdown (##見出し, -箇条書き).
  // This renders that fixed subset only; anything else is treated as plain text.
  function renderContent(raw) {
    const lines = raw.replace(/\r\n/g, "\n").split("\n");
    const html = [];
    let list = null;
    let paragraph = [];

    function flushParagraph() {
      if (paragraph.length) {
        html.push(`<p>${paragraph.map(renderInline).join("<br>")}</p>`);
        paragraph = [];
      }
    }
    function flushList() {
      if (list) {
        const items = list.items.map((i) => `<li>${renderInline(i)}</li>`).join("");
        html.push(`<${list.type}>${items}</${list.type}>`);
        list = null;
      }
    }

    for (const rawLine of lines) {
      const line = rawLine.trim();
      if (line === "") {
        flushParagraph();
        flushList();
        continue;
      }
      const h4 = line.match(/^###\s+(.*)/);
      const h3 = !h4 && line.match(/^##\s+(.*)/);
      const ol = line.match(/^\d+[.)]\s+(.*)/);
      const ul = !ol && line.match(/^[-*・]\s+(.*)/);

      if (h4) {
        flushParagraph();
        flushList();
        html.push(`<h4>${renderInline(h4[1])}</h4>`);
      } else if (h3) {
        flushParagraph();
        flushList();
        html.push(`<h3>${renderInline(h3[1])}</h3>`);
      } else if (ul) {
        flushParagraph();
        if (!list || list.type !== "ul") {
          flushList();
          list = { type: "ul", items: [] };
        }
        list.items.push(ul[1]);
      } else if (ol) {
        flushParagraph();
        if (!list || list.type !== "ol") {
          flushList();
          list = { type: "ol", items: [] };
        }
        list.items.push(ol[1]);
      } else {
        flushList();
        paragraph.push(line);
      }
    }
    flushParagraph();
    flushList();
    return html.join("\n");
  }

  function estimateReadTime(raw) {
    const charCount = raw.replace(/[#*\-・]/g, "").trim().length;
    const minutes = charCount / 500; // 日本語の一般的な黙読速度の目安
    return minutes < 1 ? "読了目安: 1分未満" : `読了目安: 約${Math.round(minutes)}分`;
  }

  expandBtn.addEventListener("click", () => {
    const expanded = resultCard.classList.toggle("expanded");
    expandBtn.textContent = expanded ? "元のサイズに戻す" : "大きく表示";
  });

  function getMode() {
    return document.querySelector('input[name="mode"]:checked').value;
  }

  function updateSubmitLabel() {
    submitBtn.textContent = getMode() === "transcript" ? "文字起こしを取得する" : "要約する";
  }
  modeRadios.forEach((r) => r.addEventListener("change", updateSubmitLabel));
  updateSubmitLabel();

  titleBtn.addEventListener("click", () => {
    window.location.reload();
  });

  function setLoading(isLoading) {
    submitBtn.disabled = isLoading;
    urlInput.disabled = isLoading;
    statusEl.classList.toggle("visible", isLoading);
  }

  function showError(message) {
    errorText.textContent = message;
    errorEl.classList.add("visible");
  }

  function clearError() {
    errorText.textContent = "";
    errorEl.classList.remove("visible");
  }

  function showResult(summary, transcriptLang, availableLangs, mode) {
    currentRawText = summary;

    const { title, topics, body } =
      mode === "summary" ? parseSourceNote(summary) : { title: "", topics: [], body: summary };

    resultTitle.textContent = title || (mode === "transcript" ? "文字起こし全文" : "要約結果");
    resultEl.innerHTML = renderContent(body);
    readTimeEl.textContent = estimateReadTime(body);

    topicsEl.innerHTML = topics.map((t) => `<span class="topic-tag">${escapeHtml(t)}</span>`).join("");
    topicsEl.hidden = topics.length === 0;

    resultCard.classList.add("visible");
    const parts = [];
    if (transcriptLang) parts.push(`字幕言語: ${transcriptLang}`);
    if (Array.isArray(availableLangs) && availableLangs.length > 0) {
      parts.push(`利用可能な言語: ${availableLangs.join(", ")}`);
    }
    metaEl.textContent = parts.join(" / ");
    saveBtn.hidden = mode !== "summary";
  }

  async function handleSubmit() {
    const url = urlInput.value.trim();
    const mode = getMode();
    clearError();
    resultCard.classList.remove("visible");
    resultCard.classList.remove("expanded");
    expandBtn.textContent = "大きく表示";
    resultEl.innerHTML = "";
    currentRawText = "";
    topicsEl.hidden = true;
    topicsEl.innerHTML = "";

    if (!url) {
      showError("動画のURLを入力してください。");
      return;
    }

    if (!WORKER_URL || WORKER_URL.includes("your-worker-subdomain")) {
      showError("Worker URLが設定されていません。index.html内のWORKER_URLを設定してください。");
      return;
    }

    setLoading(true);
    statusText.textContent =
      mode === "transcript" ? "字幕を取得しています…" : "字幕を取得して要約しています…";

    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url, mode }),
      });

      let data;
      try {
        data = await res.json();
      } catch {
        throw new Error("サーバーからの応答を解析できませんでした。");
      }

      if (!res.ok || !data.ok) {
        throw new Error(data.error || "取得に失敗しました。");
      }

      showResult(data.summary, data.transcriptLang, data.availableLangs, mode);
    } catch (err) {
      showError(err.message || "通信エラーが発生しました。しばらくしてから再試行してください。");
    } finally {
      setLoading(false);
    }
  }

  submitBtn.addEventListener("click", handleSubmit);
  urlInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") handleSubmit();
  });

  copyBtn.addEventListener("click", async () => {
    if (!currentRawText) return;
    try {
      await navigator.clipboard.writeText(currentRawText);
      const original = copyBtn.textContent;
      copyBtn.textContent = "コピーしました";
      setTimeout(() => (copyBtn.textContent = original), 1500);
    } catch {
      const range = document.createRange();
      range.selectNodeContents(resultEl);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      document.execCommand("copy");
      selection.removeAllRanges();
    }
  });

  function markdownFileName(markdown) {
    const frontmatter = markdown.match(/^---\s*\n([\s\S]*?)\n---(?:\s*\n|$)/);
    const titleMatch = frontmatter && frontmatter[1].match(/^title:\s*(.+?)\s*$/m);
    let title = titleMatch ? titleMatch[1].trim() : "source-note";
    if (
      title.length >= 2 &&
      ((title.startsWith('"') && title.endsWith('"')) ||
        (title.startsWith("'") && title.endsWith("'")))
    ) {
      title = title.slice(1, -1);
    }
    const safeTitle = title
      .replace(/[\\/:*?"<>|]/g, "-")
      .replace(/\s+/g, " ")
      .trim()
      .slice(0, 100);
    return `${safeTitle || "source-note"}.md`;
  }

  saveBtn.addEventListener("click", () => {
    if (!currentRawText) return;
    const blob = new Blob([currentRawText], { type: "text/markdown;charset=utf-8" });
    const downloadUrl = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = downloadUrl;
    link.download = markdownFileName(currentRawText);
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(downloadUrl);
  });
</script>
</body>
</html>
