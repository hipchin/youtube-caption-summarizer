name = "youtube-caption-summarizer"
main = "worker.js"
compatibility_date = "2024-11-01"

[vars]
# GitHub Pages の origin のみを許可します。
ALLOWED_ORIGIN = "https://hipchin.github.io"

# Worker Rate Limiting binding。
# 1つのCloudflare拠点につき、summary / transcript それぞれ最大10回/分を目安に制限します。
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

# 以下はダッシュボードまたは `wrangler secret put` で設定してください（このファイルには書かないでください）。
# SUPADATA_API_KEY
# ANTHROPIC_API_KEY
